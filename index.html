<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>환승연애 X 커플 프로필 메이커</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap');
:root{
  --bg:#edf8fc;--sky:#72c7eb;--sky2:#cceefa;--navy:#24394b;--text:#2d3c48;
  --muted:#8a9ba5;--line:#dbe8ee;--card:#fff;--soft:#f7fbfd;--red:#e55b67;
  --shadow:0 16px 45px rgba(49,104,130,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(#dff5ff 0,#f5fbfd 390px,#edf5f8 100%);color:var(--text);font-family:"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hero{position:relative;overflow:hidden;padding:32px 18px 48px;background:linear-gradient(140deg,#54afe1,#9ddcf4 58%,#e2f7ff)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.28);filter:blur(1px)}
.hero:before{width:280px;height:120px;left:-70px;bottom:-45px}.hero:after{width:360px;height:150px;right:-90px;top:30px}
.hero-inner{max-width:1120px;margin:auto;position:relative;z-index:1}
.kicker{font-size:11px;letter-spacing:.25em;font-weight:900;color:#fff;margin-bottom:20px}
h1{margin:0;color:#fff;font-size:clamp(38px,7vw,70px);line-height:.98;letter-spacing:-.065em}
.sub{margin:17px 0 0;color:rgba(255,255,255,.94);font-size:14px}
.wrap{max-width:1120px;margin:-20px auto 70px;padding:0 13px;position:relative;z-index:2}
.panel{background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.toolbar{padding:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:8px;z-index:20}
.toolbar-left{display:flex;gap:8px;align-items:center}.count{font-size:12px;color:var(--muted);font-weight:800}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:11px;padding:10px 13px;font-size:12px;font-weight:800}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.sky{background:#eaf8fd;color:#318db7;border-color:#d2eef8}
.editor{margin-top:15px;display:grid;gap:18px}
.couple{overflow:hidden}
.couple-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fff,#f7fcfe)}
.num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e7f6fc;color:#399ac5;font-size:11px;font-weight:900;flex:0 0 auto}
.title{flex:1;border:0;outline:0;background:transparent;font-size:17px;font-weight:900;color:var(--navy);min-width:0}
.head-buttons{display:flex;gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}.mini.danger{color:#d34d59;background:#fff5f6;border-color:#f1cbd0}
.couple-body{padding:16px}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.profile{background:var(--soft);border:1px solid #e1edf2;border-radius:17px;padding:14px}
.profile-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#e7f5fa;border:2px solid #fff;box-shadow:0 4px 14px rgba(40,100,125,.1);flex:0 0 auto}
.photo-empty{display:grid;place-items:center;color:#7db4c9;font-size:10px;font-weight:900;text-align:center}
.upload{position:relative;overflow:hidden}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.profile-label{font-size:10px;color:#62a9c8;letter-spacing:.14em;font-weight:900}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field.full{grid-column:1/-1}label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin:0 0 4px 2px}
input,textarea,select{width:100%;border:1px solid #dce8ee;background:#fff;border-radius:9px;padding:9px 10px;outline:0;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:#79c8e8;box-shadow:0 0 0 3px rgba(121,200,232,.12)}
.relation{margin-top:13px;border:1px solid var(--line);border-radius:17px;padding:14px}
.section-label{font-size:10px;letter-spacing:.14em;color:#62a9c8;font-weight:900}
.relation-grid{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin-top:9px}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}
.xbox{border:1px solid var(--line);border-radius:17px;padding:14px}
.xhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.xhead strong{font-size:12px}.from{font-size:9px;color:#9aabb4;letter-spacing:.08em}
textarea{min-height:135px;line-height:1.65;resize:vertical}
.design{margin-top:13px;border:1px solid var(--line);border-radius:17px;padding:14px;background:#fbfdfe}
.design-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}
.design-grid .wide{grid-column:span 2}
.color-row{display:flex;gap:7px;align-items:center}.color-row input{padding:3px;height:38px}
.note{font-size:10px;color:#9aabb4;margin-top:7px}
.result{display:none;margin-top:18px;overflow:hidden}
.result-header{padding:27px 22px 30px;background:linear-gradient(135deg,#5ab5e4,#b9e6f7);color:#fff;position:relative;overflow:hidden}
.result-header:after{content:"";position:absolute;width:330px;height:140px;border-radius:50%;right:-90px;bottom:-65px;background:rgba(255,255,255,.24)}
.result-kicker{font-size:9px;letter-spacing:.23em;font-weight:900;opacity:.85}
.result-title{font-size:31px;line-height:1.05;font-weight:900;letter-spacing:-.055em;margin-top:8px}
.result-sub{font-size:11px;opacity:.9;margin-top:8px}
.result-content{padding:14px}
.result-couple{border-bottom:1px solid var(--line);padding:17px 4px}.result-couple:last-child{border:0}
.r-title{font-size:16px;font-weight:900;color:var(--navy);margin-bottom:11px}
.r-profiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.r-profile{border:1px solid var(--line);border-radius:15px;padding:11px;background:#fff}
.r-person{display:flex;gap:10px;align-items:center}.r-photo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#e9f6fb}
.r-name{font-size:15px;font-weight:900}.r-info{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5}
.r-x{border-top:1px dashed #dce7eb;margin-top:10px;padding-top:9px;font-size:10.5px;line-height:1.65;white-space:pre-wrap}
.r-relation{font-size:10px;color:#607985;margin-top:9px}
.empty{text-align:center;padding:55px 15px;color:#82949e;border:1px dashed #c9dde5;margin-top:15px}
.empty b{display:block;color:#4f6875;margin-bottom:5px}
.footer{text-align:center;color:#93a2aa;font-size:10px;padding:20px 0}
.mobile-tip{display:none}
@media(max-width:760px){
 .hero{padding:27px 15px 45px}.wrap{padding:0 9px;margin-top:-17px}
 .toolbar{position:sticky;top:5px;flex-wrap:wrap}.toolbar-left{width:100%;justify-content:space-between}
 .toolbar .actions{display:grid;grid-template-columns:1fr 1fr;width:100%}
 .toolbar .actions .btn{width:100%}
 .profiles,.xgrid,.r-profiles{grid-template-columns:1fr}
 .couple-body{padding:11px}.couple-head{padding:12px}.head-buttons .mini:first-child{display:none}
 .profile{padding:12px}.fields{grid-template-columns:1fr 1fr}
 .relation-grid{grid-template-columns:1fr 1fr}.relation-grid .note-field{grid-column:1/-1}
 .design-grid{grid-template-columns:1fr 1fr}.design-grid .wide{grid-column:1/-1}
 .result-header{padding:24px 17px 27px}.result-title{font-size:27px}
 .mobile-tip{display:block;font-size:10px;color:#82949e;margin:10px 3px}
}
@media print{
 .hero,.toolbar,.editor,.footer{display:none!important}.wrap{margin:0;padding:0}.result{display:block!important;box-shadow:none;border:0}
}
</style>
</head>
<body>
<header class="hero">
 <div class="hero-inner">
  <div class="kicker">TRANSIT LOVE · X PROFILE MAKER</div>
  <h1>환승연애<br>커플 프로필</h1>
  <p class="sub">두 사람의 연애 기록과 서로가 쓴 X소개서를 한 장에.</p>
 </div>
</header>

<main class="wrap">
 <section class="panel toolbar">
  <div class="toolbar-left"><strong>COUPLES</strong><span id="count" class="count">0 pairs</span></div>
  <div class="actions" style="display:flex;gap:7px;flex-wrap:wrap">
   <button class="btn primary" onclick="addCouple()">＋ 커플 추가</button>
   <button class="btn sky" onclick="toggleResult()">결과페이지</button>
   <button class="btn" onclick="downloadPNG()">PNG 저장</button>
  </div>
 </section>

 <div class="mobile-tip">모바일에서는 커플 카드를 위아래로 편하게 수정할 수 있어요. 결과페이지에서 PNG로 저장하세요.</div>
 <section id="editor" class="editor"></section>
 <div id="empty" class="panel empty"><b>아직 커플이 없습니다.</b>「＋ 커플 추가」로 첫 번째 커플을 만들어보세요.</div>

 <section id="result" class="panel result">
  <div class="result-header">
   <div class="result-kicker">TRANSIT LOVE · X PROFILE</div>
   <div class="result-title">우리의 지난 연애</div>
   <div class="result-sub">이 시간이 지나면 우리는 함께일까?</div>
  </div>
  <div id="resultContent" class="result-content"></div>
 </section>
 <div class="footer">PNG 저장은 현재 결과페이지를 이미지로 만들어 저장합니다. 입력 내용은 서버로 전송되지 않습니다.</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let couples=[], uid=0;
const fonts=["Noto Sans KR","Gowun Batang","Nanum Myeongjo","system-ui","serif"];

function make(){
 uid++;
 return {id:Date.now()+"_"+uid,title:"",a:{name:"",age:"",mbti:"",job:"",photo:""},b:{name:"",age:"",mbti:"",job:"",photo:""},start:"",end:"",note:"",xA:"",xB:"",design:{font:"Noto Sans KR",size:12,spacing:0,line:1.65,bg:"#ffffff",accent:"#72c7eb"}};
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function get(id){return couples.find(c=>c.id===id)}
function set(id,path,val){let o=get(id),p=path.split(".");for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function addCouple(){couples.push(make());render();setTimeout(()=>document.querySelector(".couple:last-child")?.scrollIntoView({behavior:"smooth",block:"start"}),40)}
function del(id){if(confirm("이 커플을 삭제할까요?")){couples=couples.filter(c=>c.id!==id);render()}}
function dup(id){let c=JSON.parse(JSON.stringify(get(id)));c.id=Date.now()+"_"+(++uid);c.title=(c.title||"")+" (복제)";couples.splice(couples.findIndex(x=>x.id===id)+1,0,c);render()}
function upload(id,key,input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{set(id,key,r.result);render()};r.readAsDataURL(f)}
function photo(p){return p?`<img class="photo" src="${esc(p)}">`:`<div class="photo photo-empty">PHOTO</div>`}
function profile(c,k,label,p){
 return `<div class="profile">
  <div class="profile-top">
   <label class="upload" title="사진 선택">${photo(p.photo)}<input type="file" accept="image/*" onchange="upload('${esc(c.id)}','${k}.photo',this)"></label>
   <div><div class="profile-label">PROFILE ${label}</div><div style="font-size:10px;color:#9aaab2;margin-top:4px">사진을 눌러 변경</div></div>
  </div>
  <div class="fields">
   ${inp(c,k+".name","이름",p.name,"이름")}
   ${inp(c,k+".age","나이",p.age,"예: 24세")}
   ${inp(c,k+".mbti","MBTI",p.mbti,"예: INFJ")}
   ${inp(c,k+".job","직업",p.job,"예: 변호사")}
  </div>
 </div>`
}
function inp(c,path,label,val,ph){return `<div><label>${label}</label><input value="${esc(val)}" placeholder="${ph}" oninput="set('${esc(c.id)}','${path}',this.value);sync('${esc(c.id)}')"></div>`}
function editorCard(c,i){
 let d=c.design;
 return `<article class="panel couple">
  <div class="couple-head"><div style="display:flex;align-items:center;gap:9px;min-width:0"><span class="num">${String(i+1).padStart(2,"0")}</span><input class="title" value="${esc(c.title)}" placeholder="커플 제목 · 예: 연무한 × 주화영" oninput="set('${esc(c.id)}','title',this.value)"></div>
   <div class="head-buttons"><button class="mini" onclick="dup('${esc(c.id)}')">복제</button><button class="mini danger" onclick="del('${esc(c.id)}')">삭제</button></div>
  </div>
  <div class="couple-body">
   <div class="profiles">${profile(c,"a","A",c.a)}${profile(c,"b","B",c.b)}</div>
   <div class="relation"><div class="section-label">RELATIONSHIP</div><div class="relation-grid">
    <div><label>연애 시작일</label><input type="date" value="${esc(c.start)}" onchange="set('${esc(c.id)}','start',this.value)"></div>
    <div><label>연애 종료일</label><input type="date" value="${esc(c.end)}" onchange="set('${esc(c.id)}','end',this.value)"></div>
    <div class="note-field"><label>비고</label><input value="${esc(c.note)}" placeholder="예: 2년 4개월 연애 · 이별한 지 7개월" oninput="set('${esc(c.id)}','note',this.value)"></div>
   </div></div>
   <div class="xgrid">
    <div class="xbox"><div class="xhead"><strong>${esc(c.a.name||"A")}의 X소개서</strong><span class="from">FROM B</span></div><textarea placeholder="나의 X를 소개해주세요." oninput="set('${esc(c.id)}','xA',this.value)">${esc(c.xA)}</textarea></div>
    <div class="xbox"><div class="xhead"><strong>${esc(c.b.name||"B")}의 X소개서</strong><span class="from">FROM A</span></div><textarea placeholder="나의 X를 소개해주세요." oninput="set('${esc(c.id)}','xB',this.value)">${esc(c.xB)}</textarea></div>
   </div>
   <div class="design">
    <div class="section-label">STYLE</div>
    <div class="design-grid">
     <div class="wide"><label>폰트</label><select onchange="set('${esc(c.id)}','design.font',this.value)">${fonts.map(f=>`<option ${d.font===f?"selected":""}>${f}</option>`).join("")}</select></div>
     <div><label>글자 크기</label><input type="number" min="9" max="22" step=".5" value="${d.size}" oninput="set('${esc(c.id)}','design.size',this.value)"></div>
     <div><label>자간</label><input type="number" min="-2" max="8" step=".1" value="${d.spacing}" oninput="set('${esc(c.id)}','design.spacing',this.value)"></div>
     <div><label>줄간격</label><input type="number" min="1" max="2.5" step=".05" value="${d.line}" oninput="set('${esc(c.id)}','design.line',this.value)"></div>
     <div><label>배경색</label><div class="color-row"><input type="color" value="${d.bg}" onchange="set('${esc(c.id)}','design.bg',this.value)"><input value="${d.bg}" oninput="set('${esc(c.id)}','design.bg',this.value)"></div></div>
     <div><label>포인트 색</label><div class="color-row"><input type="color" value="${d.accent}" onchange="set('${esc(c.id)}','design.accent',this.value)"><input value="${d.accent}" oninput="set('${esc(c.id)}','design.accent',this.value)"></div></div>
    </div>
    <div class="note">폰트 · 글자 크기 · 자간 · 줄간격 · 배경색 · 포인트 색을 커플마다 따로 설정할 수 있습니다.</div>
   </div>
  </div>
 </article>`
}
function render(){document.getElementById("editor").innerHTML=couples.map(editorCard).join("");document.getElementById("empty").style.display=couples.length?"none":"block";document.getElementById("count").textContent=couples.length+" pair"+(couples.length===1?"":"s");}
function sync(id){let c=get(id),card=document.querySelector(`.couple .title[value="${CSS.escape(c.title)}"]`);renderResultOnly(); if(card){/* no-op */}}
function fmt(s){return s?s.replaceAll("-","."):""}
function resultProfile(p,x,from,d){
 let style=`font-family:'${esc(d.font)}';font-size:${esc(d.size)}px;letter-spacing:${esc(d.spacing)}px;line-height:${esc(d.line)};background:${esc(d.bg)};`;
 return `<div class="r-profile" style="${style}"><div class="r-person">${p.photo?`<img class="r-photo" src="${esc(p.photo)}">`:`<div class="r-photo"></div>`}<div><div class="r-name">${esc(p.name||"이름 미정")}</div><div class="r-info">${esc([p.age,p.mbti,p.job].filter(Boolean).join(" · ")||"프로필 미입력")}</div></div></div><div class="r-x"><b>${from}</b><br>${esc(x||"작성된 X소개서가 없습니다.")}</div></div>`
}
function buildResult(){
 return couples.map((c,i)=>`<div class="result-couple" style="font-family:'${esc(c.design.font)}';letter-spacing:${esc(c.design.spacing)}px;line-height:${esc(c.design.line)};background:${esc(c.design.bg)}">
  <div class="r-title" style="color:${esc(c.design.accent)}">${esc(c.title||`Couple ${i+1}`)}</div>
  <div class="r-profiles">${resultProfile(c.a,c.xA,"B가 쓴 X소개서",c.design)}${resultProfile(c.b,c.xB,"A가 쓴 X소개서",c.design)}</div>
  <div class="r-relation">${c.start||c.end?`${fmt(c.start)} — ${fmt(c.end)}`:""}${c.note?`　·　${esc(c.note)}`:""}</div>
 </div>`).join("")
}
function renderResultOnly(){document.getElementById("resultContent").innerHTML=buildResult()}
function toggleResult(){let r=document.getElementById("result");renderResultOnly();r.style.display=r.style.display==="block"?"none":"block";if(r.style.display==="block")r.scrollIntoView({behavior:"smooth",block:"start"})}
async function downloadPNG(){
 if(!couples.length){alert("먼저 커플을 추가해주세요.");return}
 renderResultOnly();let r=document.getElementById("result");r.style.display="block";
 try{
  const canvas=await html2canvas(r,{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false});
  const a=document.createElement("a");a.download="환승연애_커플프로필.png";a.href=canvas.toDataURL("image/png");a.click();
 }catch(e){alert("PNG 저장 중 문제가 발생했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.")}
}
if(!couples.length)addCouple();
</script>
</body>
</html>
