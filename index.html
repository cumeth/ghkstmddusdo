<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUPLE REPORT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

@font-face{font-family:"부크크 고딕체";src:local("부크크 고딕체"),local("Bookk Gothic");font-weight:100 900}
@font-face{font-family:"부크크 명조";src:local("부크크 명조"),local("Bookk Myungjo");font-weight:400 900}

:root{
  --sky:#78cfee;
  --sky2:#b9e9f7;
  --pale:#edf9fc;
  --navy:#253b4b;
  --ink:#263944;
  --muted:#81929b;
  --line:#d8e8ed;
  --white:#fff;
  --red:#e65c63;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 42%,rgba(255,255,255,.95) 0 8%,transparent 22%),
    radial-gradient(circle at 91% 76%,rgba(255,255,255,.72) 0 7%,transparent 20%),
    linear-gradient(#e9f8fc,#f5fbfd 58%,#e6f7fb);
  font-family:Inter,"Noto Sans KR",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button,input,textarea,select{outline:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{box-shadow:0 0 0 3px rgba(118,207,238,.28)}

.hero{
  position:relative;
  min-height:415px;
  overflow:hidden;
  color:#fff;
  background:
    radial-gradient(ellipse at 75% 62%,rgba(255,255,255,.52) 0 11%,transparent 34%),
    radial-gradient(ellipse at 18% 91%,rgba(255,255,255,.22) 0 13%,transparent 36%),
    linear-gradient(135deg,color-mix(in srgb,var(--theme-main) 82%,#4bbbe5) 0%,var(--theme-main) 42%,color-mix(in srgb,var(--theme-main) 35%,white) 100%);
}
.hero:before,.hero:after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  background:rgba(255,255,255,.14);
}
.hero:before{width:470px;height:470px;left:-170px;top:185px}
.hero:after{width:360px;height:360px;right:-120px;top:70px;background:rgba(255,255,255,.18)}
.hero-inner{
  position:relative;
  z-index:2;
  max-width:1180px;
  margin:auto;
  padding:58px 28px 150px;
}
.hero-kicker{
  font-size:11px;
  font-weight:700;
  letter-spacing:.28em;
  opacity:.95;
}
.hero h1{
  margin:38px 0 25px;
  font-size:clamp(48px,7vw,82px);
  line-height:.92;
  letter-spacing:-.075em;
  font-weight:900;
}
.hero-sub{
  margin:0;
  font-size:15px;
  line-height:1.7;
  letter-spacing:-.02em;
  opacity:.86;
}

.wrap{
  position:relative;
  z-index:4;
  max-width:1180px;
  margin:-105px auto 0;
  padding:0 20px 60px;
}
.toolbar{
  background:rgba(255,255,255,.97);
  border:1px solid rgba(255,255,255,.95);
  border-radius:30px;
  box-shadow:0 18px 42px rgba(54,118,142,.13);
  padding:22px;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:20px;
  align-items:center;
}
.toolbar-left{
  min-width:145px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
}
.toolbar-left strong{
  font-size:23px;
  letter-spacing:-.045em;
}
.count{
  font-size:11px;
  color:#92a1a8;
  font-weight:700;
}
.actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  flex-wrap:wrap;
}
.btn{
  min-height:42px;
  border-radius:13px;
  border:1px solid #d7e5e9;
  background:#fff;
  color:var(--navy);
  padding:0 17px;
  font-size:12px;
  font-weight:800;
  transition:.15s ease;
}
.btn:hover{transform:translateY(-1px)}

.theme-picker{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:42px;
  padding:0 9px 0 12px;
  border:1px solid #d7e5e9;
  border-radius:13px;
  background:#fff;
}
.theme-picker span{
  color:#93a3aa;
  font-size:7px;
  font-weight:900;
  letter-spacing:.16em;
}
.theme-picker select{
  border:0;
  background:transparent;
  color:var(--navy);
  font-size:10px;
  font-weight:800;
}
.actions{align-items:center}

.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sky{background:var(--theme-soft,#e8f7fb);border-color:color-mix(in srgb,var(--theme-main) 30%,white);color:color-mix(in srgb,var(--theme-main) 72%,#263944)}

.tip{
  margin:13px 6px 0;
  color:#91a4ac;
  font-size:11px;
  line-height:1.6;
}

#list{display:grid;gap:24px;margin-top:24px}
.item{
  overflow:hidden;
  background:#fff;
  border:1px solid #dbe9ed;
  border-radius:29px;
  box-shadow:0 13px 32px rgba(50,107,128,.08);
}
.itembar{
  min-height:58px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #e6eff2;
  background:#fbfeff;
}
.itemno{
  color:#5ba8c5;
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em;
}
.itembar input{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:var(--navy);
  font-size:13px;
  font-weight:800;
}
.itembar input::placeholder{color:#a7b5bb}
.itembar button{
  border:1px solid #dce8ec;
  background:#fff;
  color:#70838c;
  border-radius:10px;
  padding:7px 10px;
  font-size:10px;
  font-weight:700;
}
.content{padding:28px}

.intro{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  padding-bottom:25px;
  border-bottom:1px solid #dfeaec;
}
.intro-kicker{
  color:var(--theme-main,#76cfee);
  font-size:9px;
  font-weight:900;
  letter-spacing:.2em;
}
.intro-title{
  margin:7px 0 0;
  color:var(--navy);
  font-size:32px;
  line-height:1;
  letter-spacing:-.065em;
  font-weight:900;
}
.intro-title small{display:block;margin-top:7px;color:#9aaab0;font-size:10px;letter-spacing:0;font-weight:600}

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:22px;
}
.person{
  min-width:0;
  padding:18px;
  border:1px solid #dbeaf0;
  border-radius:22px;
  background:linear-gradient(145deg,#fff 0%,#f8fdff 100%);
}
.person:nth-child(2){background:linear-gradient(145deg,#fff 0%,#fbfeff 100%)}
.person-num{
  margin-bottom:13px;
  color:var(--theme-main,#76cfee);
  font-size:8px;
  font-weight:900;
  letter-spacing:.17em;
}
.person-layout{
  display:grid;
  grid-template-columns:125px 1fr;
  gap:16px;
  align-items:start;
}
.photo-box{
  position:relative;
  display:block;
  height:158px;
  overflow:hidden;
  border-radius:16px;
  background:var(--theme-soft,#e8f7fb);
  border:1px solid #d8edf3;
}
.photo-box img{width:100%;height:100%;object-fit:cover;display:block}
.photo-box em{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#79aebf;font-size:8px;font-style:normal;font-weight:900;letter-spacing:.16em;
}
.photo-box input{position:absolute;inset:0;opacity:0;cursor:pointer}
.name{
  margin:17px 0 8px;
  color:var(--navy);
  font-size:32px;
  line-height:.92;
  letter-spacing:-.085em;
  font-weight:900;
}
.quick{font-size:10px;color:#81939c;line-height:1.7}
.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 12px;
  margin-top:18px;
  border-top:1px solid #dce9ed;
}
.meta div{
  padding:10px 0;
  border-bottom:1px solid #e8f0f2;
}
.meta div:nth-child(odd){padding-right:10px;border-right:1px solid #e2ecef}
.meta div:nth-child(even){padding-left:2px}
.meta label{
  display:block;
  margin-bottom:5px;
  color:#94a4aa;
  font-size:7px;
  font-weight:900;
  letter-spacing:.12em;
}
.meta input{
  width:100%;
  border:0;
  background:transparent;
  color:#40535c;
  font-size:10px;
  font-weight:700;
}
.meta input::placeholder{color:#b0bdc2}

.relation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}
.relation .cell{
  padding:17px 18px;
  border-radius:18px;
  background:var(--theme-soft,#eef9fc);
  border:1px solid #d7edf3;
}
.relation .cell.note{background:#f8fcfd}
.relation label{
  display:block;
  margin-bottom:7px;
  color:var(--theme-main,#76cfee);
  font-size:7px;
  font-weight:900;
  letter-spacing:.15em;
}
.relation input{
  width:100%;
  border:0;
  background:transparent;
  color:var(--navy);
  font-size:13px;
  font-weight:800;
}
.relation .note input{text-align:right}
.relation input::placeholder{color:#a6b4b9}

.xhead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:30px 2px 13px;
}
.xhead h2{
  margin:0;
  color:var(--navy);
  font-size:22px;
  line-height:1;
  letter-spacing:-.055em;
}
.xhead span{
  color:#9aaab0;
  font-size:7px;
  font-weight:900;
  letter-spacing:.18em;
}
.xgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.xcard{
  padding:18px;
  min-width:0;
  border-radius:19px;
  background:var(--theme-pale,#f1fafe);
  border:1px solid #d8eef5;
}
.xcard:nth-child(2){background:#f7fcfd}
.from-input{
  display:block;
  width:100%;
  border:0;
  padding:0;
  margin:0 0 8px;
  background:transparent;
  color:var(--theme-main,#76cfee);
  font-size:8px;
  font-weight:900;
  letter-spacing:.16em;
}
.from-input::placeholder{color:#a8b8bd;font-weight:700}
.xcard .from{
  color:var(--theme-main,#76cfee);
  font-size:8px;
  font-weight:900;
  letter-spacing:.16em;
}
.xcard strong{
  display:block;
  margin:8px 0 12px;
  color:var(--navy);
  font-size:16px;
  letter-spacing:-.045em;
}
.xcard textarea{
  width:100%;
  height:145px;
  resize:vertical;
  border:0;
  background:transparent;
  color:#52656d;
  font-size:11px;
  line-height:1.85;
}
.xcard textarea::placeholder{color:#a9b8bd}

.controls{
  margin-top:16px;
  padding:14px;
  border-radius:18px;
  background:#f5fbfd;
  border:1px solid #deedf1;
  display:grid;
  grid-template-columns:1.5fr .6fr .85fr .65fr .55fr .6fr 1.7fr;
  gap:7px;
}
.controls small{
  grid-column:1/-1;
  margin-bottom:2px;
  color:#89a0aa;
  font-size:7px;
  font-weight:900;
  letter-spacing:.16em;
}
.controls input,.controls select{
  min-width:0;
  height:32px;
  border:1px solid #d5e6eb;
  border-radius:9px;
  padding:0 8px;
  background:#fff;
  color:#60747d;
  font-size:9px;
}
.controls input[type="color"]{padding:3px;cursor:pointer}

.empty{
  margin-top:24px;
  padding:65px 20px;
  text-align:center;
  border:1px dashed #c8dfe6;
  border-radius:25px;
  background:rgba(255,255,255,.72);
  color:#8498a1;
  font-size:12px;
}
.empty b{display:block;margin-bottom:7px;color:#58717d;font-size:17px}

.preview{
  display:none;
  margin-top:28px;
  overflow:hidden;
  border-radius:27px;
  background:#fff;
  box-shadow:0 14px 38px rgba(50,107,128,.11);
}
.report{
  --accent:#78cfee;
  background:
    radial-gradient(circle at 12% 44%,rgba(255,255,255,.96) 0 8%,transparent 23%),
    radial-gradient(circle at 90% 75%,rgba(255,255,255,.76) 0 7%,transparent 20%),
    linear-gradient(var(--theme-soft,#e9f8fc),var(--theme-pale,#f5fbfd) 58%,var(--theme-soft,#e7f7fb));
  min-height:1180px;
  padding:0 24px 70px;
  color:#283d47;
  font-family:inherit;
  letter-spacing:0;
}
.report-head{
  position:relative;
  overflow:hidden;
  margin:0 -24px;
  padding:48px 55px 125px;
  color:#fff;
  background:
    radial-gradient(ellipse at 75% 63%,rgba(255,255,255,.52) 0 11%,transparent 34%),
    radial-gradient(ellipse at 18% 91%,rgba(255,255,255,.22) 0 13%,transparent 36%),
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 82%,#4bbbe5) 0%,var(--accent) 45%,color-mix(in srgb,var(--accent) 35%,white) 100%);
}
.report-head:before,.report-head:after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  background:rgba(255,255,255,.14);
}
.report-head:before{width:440px;height:440px;left:-160px;top:175px}
.report-head:after{width:340px;height:340px;right:-110px;top:55px;background:rgba(255,255,255,.17)}
.report-head strong,.report-head span{
  position:relative;
  z-index:2;
}
.report-head strong{
  display:block;
  font-size:11px;
  font-weight:800;
  letter-spacing:.28em;
}
.report-head span{
  float:right;
  margin-top:-14px;
  font-size:8px;
  font-weight:800;
  letter-spacing:.16em;
}
.report-title{
  position:relative;
  z-index:5;
  margin:-50px auto 0;
  max-width:1040px;
  padding:17px 24px 16px;
  text-align:left;
  border:1px solid rgba(255,255,255,.92);
  border-radius:18px;
  background:rgba(255,255,255,.97);
  box-shadow:0 10px 24px rgba(54,118,142,.09);
}
.report-title label{
  display:block;
  color:var(--accent);
  font-size:7px;
  font-weight:700;
  letter-spacing:.16em;
  margin-bottom:5px;
}
.report-title h1{
  margin:0;
  color:#40535c;
  font-size:24px;
  line-height:1;
  letter-spacing:-.055em;
  font-weight:600;
}
.report-people{
  position:relative;
  z-index:4;
  max-width:1040px;
  margin:18px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.rperson{
  padding:18px;
  border:1px solid #dbeaf0;
  border-radius:22px;
  background:rgba(255,255,255,.96);
  box-shadow:0 10px 25px rgba(50,107,128,.055);
}
.rtop{display:grid;grid-template-columns:125px 1fr;gap:16px}
.rphoto{width:125px;height:158px;object-fit:cover;border-radius:16px;background:var(--theme-soft,#eaf8fb);border:1px solid #d8edf3}
.rname{margin-top:18px;color:#263b46;font-size:31px;font-weight:900;line-height:.92;letter-spacing:-.08em}
.rinfo{margin-top:10px;color:#81939b;font-size:10px;line-height:1.7;font-weight:var(--report-weight,500)}
.report-rel{
  position:relative;
  z-index:4;
  max-width:1040px;
  margin:15px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.report-rel>div{
  padding:17px 18px;
  border-radius:18px;
  background:var(--theme-soft,#eef9fc);
  border:1px solid #d7edf3;
  box-shadow:0 7px 18px rgba(50,107,128,.035);
}
.report-rel>div+div{background:rgba(255,255,255,.75)}
.report-rel label{
  display:block;
  margin-bottom:7px;
  color:var(--accent);
  font-size:7px;
  font-weight:900;
  letter-spacing:.15em;
}
.report-rel p{margin:0;font-size:12px;font-weight:var(--report-weight,500)}
.report-x{
  position:relative;
  z-index:4;
  max-width:1040px;
  margin:25px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.rx{
  min-width:0;
  padding:19px;
  border-radius:20px;
  background:var(--theme-pale,#f1fafe);
  border:1px solid #d8eef5;
  box-shadow:0 8px 20px rgba(50,107,128,.035);
}
.rx:nth-child(2){background:rgba(255,255,255,.72)}
.rx h3{
  margin:0 0 13px;
  color:#304853;
  font-size:12px;
  font-weight:900;
}
.rx h3 span{
  float:right;
  color:var(--accent);
  font-size:7px;
  font-weight:700;
  letter-spacing:.14em;
}
.rx p{
  margin:0;
  white-space:pre-wrap;
  color:#52666f;
  font-size:10px;
  line-height:1.9;
  font-weight:var(--report-weight,500);
}
.footer{
  max-width:1040px;
  margin:22px auto 0;
  padding-top:10px;
  border-top:1px solid #dce8eb;
  color:#91a1a8;
  font-size:7px;
}

@media(max-width:820px){
  .hero{min-height:390px}
  .hero-inner{padding:48px 20px 145px}
  .wrap{margin-top:-72px;padding:0 11px 45px}
  .toolbar{grid-template-columns:1fr;gap:15px;padding:18px}
  .toolbar-left{width:100%}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions .btn:last-child{grid-column:1/-1}
  .actions .btn{width:100%}
  .content{padding:20px 14px}
  .intro{align-items:start;flex-direction:column;gap:4px}
  .intro-title{font-size:30px}
  .people,.xgrid,.report-people,.report-x{grid-template-columns:1fr}
  .person-layout,.rtop{grid-template-columns:125px 1fr}
  .photo-box{height:160px}
  .rphoto{width:125px;height:160px}
  .relation,.report-rel{grid-template-columns:1fr}
  .relation .note input{text-align:left}
  .controls{grid-template-columns:1fr 1fr}
  .controls small{grid-column:1/-1}
  .controls input:last-child{grid-column:1/-1}
  .report{padding:0 11px 42px}
  .report-head{margin:0 -11px;padding:35px 20px 105px}
  .report-title{margin:-43px 7px 0;padding:15px 18px}
  .report-title h1{font-size:22px}
  .report-people,.report-rel,.report-x{margin-left:7px;margin-right:7px}
  .report-people,.report-rel,.report-x{grid-template-columns:1fr}
}
@media(max-width:430px){
  .hero h1{font-size:50px}
  .hero-sub{font-size:13px}
  .person-layout,.rtop{grid-template-columns:105px 1fr;gap:12px}
  .photo-box{height:145px}
  .rphoto{width:105px;height:145px}
  .name,.rname{font-size:28px}
  .quick,.rinfo{font-size:9px}
  .itembar{padding:9px 12px}
  .itembar button{padding:6px 8px}
}

@media print{
  body{background:#fff}
  .hero,.toolbar,.tip,#list,.empty{display:none!important}
  .wrap{margin:0;padding:0;max-width:none}
  .preview{display:block!important;margin:0;border-radius:0;box-shadow:none}
}

/* Result header = maker hero hierarchy */
.report-head{padding:56px 22px 78px;border-radius:0 0 34px 34px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,white));position:relative;overflow:hidden}
.report-head:before,.report-head:after{content:"";position:absolute;border-radius:999px;background:rgba(255,255,255,.16);pointer-events:none}
.report-head:before{width:220px;height:220px;right:-55px;top:-70px}
.report-head:after{width:150px;height:150px;left:-55px;bottom:-75px}
.report-head-inner{position:relative;z-index:1;max-width:720px;margin:auto;text-align:left}
.report-kicker{font-size:10px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.86);margin-bottom:14px}
.report-head h1{margin:0;color:#fff;font-size:clamp(31px,8vw,52px);line-height:1.02;letter-spacing:-.055em;font-weight:650}
.report-head p{margin:13px 0 0;color:rgba(255,255,255,.9);font-size:12px;line-height:1.7;font-weight:400}


/* FINAL RESULT HERO — same hierarchy as maker hero */
.report-head{
  position:relative;
  overflow:hidden;
  padding:58px 22px 76px;
  border-radius:0 0 34px 34px;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,white));
}
.report-head:before,
.report-head:after{
  content:"";
  position:absolute;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  pointer-events:none;
}
.report-head:before{width:220px;height:220px;right:-55px;top:-70px}
.report-head:after{width:150px;height:150px;left:-55px;bottom:-75px}

<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-kicker">TRANSIT LOVE · X PROFILE MAKER</div>
    <h1>환승연애<br>커플 프로필</h1>
    <p class="hero-sub">두 사람의 연애 기록과 서로가 쓴 X소개서를 한 장에.</p>
  </div>
</header>

<main class="wrap">
  <section class="toolbar">
    <div class="toolbar-left">
      <strong>COUPLES</strong>
      <span id="counter" class="count">00 pairs</span>
    </div>
    <div class="actions">
      <button class="btn dark" onclick="add()">＋ 커플 추가</button>
      <button class="btn sky" onclick="preview()">결과페이지</button>
      <button class="btn" onclick="save()">PNG 저장</button>
      <button class="btn" onclick="saveHTML()">HTML 저장</button>
    </div>
  </section>

  <div class="tip">모바일에서는 커플 카드를 위아래로 편하게 수정할 수 있어요. 결과페이지에서 PNG로 저장하세요.</div>

  <div id="list"></div>
  <div id="empty" class="empty"><b>아직 커플이 없습니다.</b>「＋ 커플 추가」로 첫 번째 커플을 만들어보세요.</div>

  <section id="previewBox" class="preview">
    <div id="preview"></div>
  </section>
</main>


<script>
/* html2canvas loader: try multiple CDNs so PNG export also works when one CDN is blocked. */
window.__html2canvasReady = (async function(){
  if(typeof window.html2canvas === "function") return true;
  const sources = [
    "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"
  ];
  for(const src of sources){
    try{
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src=src;
        s.onload=()=>resolve();
        s.onerror=()=>reject(new Error("load failed"));
        document.head.appendChild(s);
      });
      if(typeof window.html2canvas === "function") return true;
    }catch(e){}
  }
  return false;
})();
</script>
<script>
let rows=[],n=0;
const themes={
  sky:{main:"#78cfee",soft:"#eaf8fc",pale:"#f4fbfd"},
  mint:{main:"#7fd8c1",soft:"#ebfaf5",pale:"#f5fcf9"},
  lavender:{main:"#b8a9e8",soft:"#f4f0fc",pale:"#faf8fe"},
  peach:{main:"#f2ad91",soft:"#fff1ea",pale:"#fff9f5"},
  butter:{main:"#e8ca68",soft:"#fff9df",pale:"#fffdf2"},
  mono:{main:"#9aa5aa",soft:"#f0f2f3",pale:"#f8f9f9"}
};
const fontList=["Noto Sans KR","Inter","부크크 고딕체","부크크 명조","Georgia","Arial","Times New Roman"];


function fresh(){
  return {
    id:Date.now()+"_"+(++n),
    title:"",
    a:{name:"",age:"",mbti:"",job:"",photo:""},
    b:{name:"",age:"",mbti:"",job:"",photo:""},
    period:"",note:"",xa:"",xb:"",
    font:"Noto Sans KR",size:11,spacing:0,line:1.9,weight:500,
    footer:"",accent:"#76cfee",theme:"sky",fromA:"",fromB:"",headerA:"",headerB:"",headerText:"",theme:"sky" 
  }
}
function add(){rows.push(fresh());draw()}
function get(id){return rows.find(x=>x.id===id)}
function put(id,path,v){
  let x=get(id),p=path.split(".");
  for(let i=0;i<p.length-1;i++)x=x[p[i]];
  x[p.at(-1)]=v;
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))
}
function photo(p){return p?`<img src="${esc(p)}">`:`<em>PHOTO</em>`}
function upload(id,path,e){
  let f=e.files[0]; if(!f)return;
  let r=new FileReader();
  r.onload=()=>{put(id,path,r.result);draw()};
  r.readAsDataURL(f);
}
function field(c,path,label,val,ph){
  return `<div><label>${label}</label><input value="${esc(val)}" placeholder="${ph}" oninput="put('${c.id}','${path}',this.value);refresh()"></div>`
}
function person(c,key,code,p){
  return `<article class="person">
    
    <div class="person-layout">
      <label class="photo-box">
        ${photo(p.photo)}
        <input type="file" accept="image/*" onchange="upload('${c.id}','${key}.photo',this)">
      </label>
      <div>
        <div class="name">${esc(p.name||"이름")}</div>
        <div class="quick">${esc([p.age,p.mbti,p.job].filter(Boolean).join(" · "))}</div>
      </div>
    </div>
    <div class="meta">
      ${field(c,key+".name","NAME",p.name,"이름")}
      ${field(c,key+".age","AGE",p.age,"24")}
      ${field(c,key+".mbti","MBTI",p.mbti,"INFJ")}
      ${field(c,key+".job","JOB",p.job,"직업")}
    </div>
  </article>`
}
function card(c,i){
  return `<article class="item" style="--accent:${esc(c.accent||"#76cfee")}">
    <div class="itembar">
      <span class="itemno">${String(i+1).padStart(2,"0")}</span>
      <input value="${esc(c.title)}" placeholder="커플 식별명" oninput="put('${c.id}','title',this.value);refresh()">
      <button onclick="copyRow('${c.id}')">복제</button>
      <button onclick="removeRow('${c.id}')">삭제</button>
    </div>
    <div class="content">
      <div class="intro">
        <div>
          <div class="intro-kicker">COUPLE REPORT</div>
          <div class="intro-title">커플 프로필<small>두 사람의 정보와 X 소개서를 입력하세요.</small></div>
        </div>
      </div>

      <div class="people">${person(c,"a","",c.a)}${person(c,"b","",c.b)}</div>

      <div class="relation">
        <div class="cell">
          <label>DATING PERIOD</label>
          <input value="${esc(c.period)}" placeholder="2년 4개월" oninput="put('${c.id}','period',this.value);refresh()">
        </div>
        <div class="cell note">
          <label>NOTE</label>
          <input value="${esc(c.note)}" placeholder="이별한 지 7개월" oninput="put('${c.id}','note',this.value);refresh()">
        </div>
      </div>

      <div class="xhead">
        <h2>X 소개서</h2>
        <span>PERSONAL NOTES</span>
      </div>

      <div class="xgrid">
        <div class="xcard">
          <input class="from-input" value="${esc(c.fromA||"")}" placeholder="FROM 이름 (선택)" oninput="put('${c.id}','fromA',this.value);refresh()">
          <strong>${esc(c.a.name||"")}</strong>
          <textarea oninput="put('${c.id}','xa',this.value);refresh()" placeholder="X 소개서를 입력하세요.">${esc(c.xa)}</textarea>
        </div>
        <div class="xcard">
          <input class="from-input" value="${esc(c.fromB||"")}" placeholder="FROM 이름 (선택)" oninput="put('${c.id}','fromB',this.value);refresh()">
          <strong>${esc(c.b.name||"")}</strong>
          <textarea oninput="put('${c.id}','xb',this.value);refresh()" placeholder="X 소개서를 입력하세요.">${esc(c.xb)}</textarea>
        </div>
      </div>

      <div class="controls">
        <small>RESULT THEME · TYPE SETTINGS · POINT COLOR · TEXT</small>
        <textarea class="header-name-input" rows="2" placeholder="결과 제목을 입력하세요&#10;예: MUHAN X&#10;HWAYOUNG" oninput="put('${c.id}','headerText',this.value);refresh()">${esc(c.headerText||"")}</textarea>
      <select title="결과페이지 테마" onchange="put('${c.id}','theme',this.value);refresh()">
          ${Object.keys(themes).map(k=>`<option value="${k}" ${c.theme===k?"selected":""}>${k.toUpperCase()}</option>`).join("")}
        </select>
        <select title="폰트" onchange="put('${c.id}','font',this.value);refresh()">${fontList.map(f=>`<option ${c.font===f?"selected":""}>${f}</option>`).join("")}</select>
        <input type="number" value="${c.size}" min="8" max="20" step=".5" title="글자 크기" oninput="put('${c.id}','size',this.value);refresh()">
        <select title="글자 굵기" onchange="put('${c.id}','weight',this.value);refresh()">${[400,500,600,700,800,900].map(w=>`<option value="${w}" ${Number(c.weight)===w?"selected":""}>굵기 ${w}</option>`).join("")}</select>
        <input type="number" value="${c.spacing}" min="-2" max="6" step=".1" title="자간" oninput="put('${c.id}','spacing',this.value);refresh()">
        <input type="color" value="${esc(c.accent||"#76cfee")}" title="포인트 컬러" onchange="put('${c.id}','accent',this.value);draw()">
        <input type="number" value="${c.line}" min="1" max="2.5" step=".05" title="줄간격" oninput="put('${c.id}','line',this.value);refresh()">
        <input value="${esc(c.footer)}" placeholder="하단 문구 (선택)" oninput="put('${c.id}','footer',this.value);refresh()">
      </div>
    </div>
  </article>`
}
function removeRow(id){rows=rows.filter(x=>x.id!==id);draw()}
function copyRow(id){
  let x=JSON.parse(JSON.stringify(get(id)));
  x.id=Date.now()+"_"+(++n);
  rows.splice(rows.findIndex(y=>y.id===id)+1,0,x);
  draw();
}
function rp(c,p,code){
  return `<article class="rperson">
    <div class="rtop">
      <div>${p.photo?`<img class="rphoto" src="${esc(p.photo)}">`:`<div class="rphoto"></div>`}</div>
      <div>
        
        <div class="rname">${esc(p.name||"이름")}</div>
        <div class="rinfo">${esc([p.age,p.mbti,p.job].filter(Boolean).join(" · "))}</div>
      </div>
    </div>
  </article>`
}
function report(c,i){
  const th=themes[c.theme||"sky"]||themes.sky;
  return `<div class="report"
    style="font-family:'${esc(c.font)}';letter-spacing:${esc(c.spacing)}px;--accent:${esc(c.accent||th.main)};--theme-soft:${th.soft};--theme-pale:${th.pale};--report-weight:${esc(c.weight||500)}">
    <div class="report-head">
      <div class="report-head-inner">
        <div class="report-kicker">COUPLE REPORT · NO.${String(i+1).padStart(2,"0")}</div>
        <h1>${esc(c.headerText||"MUHAN X\nHWAYOUNG").replace(/\n/g,"<br>")}</h1>
        <p>두 사람의 연애 기록과 서로가 쓴 X소개서를 한 장에.</p>
      </div>
    </div>
    
    <div class="report-people">${rp(c,c.a,"")}${rp(c,c.b,"")}</div>
    <div class="report-rel">
      <div><label>DATING PERIOD</label><p>${esc(c.period||"—")}</p></div>
      <div><label>NOTE</label><p>${esc(c.note||"—")}</p></div>
    </div>
    <div class="report-x">
      <div class="rx"><h3>X 소개서 ${c.fromA?`<span>FROM ${esc(c.fromA)}</span>`:""}</h3><p style="font-size:${c.size}px;line-height:${c.line}">${esc(c.xa||"")}</p></div>
      <div class="rx"><h3>X 소개서 ${c.fromB?`<span>FROM ${esc(c.fromB)}</span>`:""}</h3><p style="font-size:${c.size}px;line-height:${c.line}">${esc(c.xb||"")}</p></div>
    </div>
    ${c.footer?`<div class="footer">${esc(c.footer)}</div>`:""}
  </div>`
}
function refresh(){document.getElementById("preview").innerHTML=rows.map(report).join("")}
function draw(){
  document.getElementById("list").innerHTML=rows.map(card).join("");
  document.getElementById("empty").style.display=rows.length?"none":"block";
  document.getElementById("counter").textContent=String(rows.length).padStart(2,"0")+" pairs";
  refresh();
}
function preview(){
  if(!rows.length)return alert("커플을 먼저 추가해 주세요.");
  refresh();
  let x=document.getElementById("previewBox");
  x.style.display=x.style.display==="block"?"none":"block";
  if(x.style.display==="block")x.scrollIntoView({behavior:"smooth"});
}
async function save(){
  if(rows.length!==1)return alert("PNG 저장은 한 커플씩 저장합니다. 현재 커플만 남겨주세요.");
  refresh();
  const box=document.querySelector(".report");
  if(!box)return;

  try{
    if(window.__html2canvasReady) await window.__html2canvasReady;
    if(typeof html2canvas!=="function") throw new Error("html2canvas unavailable");

    box.classList.add("export-fit");
    if(document.fonts?.ready) await document.fonts.ready;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    let canvas;
    try{
      canvas=await html2canvas(box,{
        scale:2,
        backgroundColor:"#fff",
        useCORS:true,
        allowTaint:false,
        logging:false,
        imageTimeout:10000,
        scrollX:0,scrollY:0
      });
    }catch(e){
      console.warn("PNG first render failed",e);
      // Retry with a clean clone. This handles mobile Safari/html2canvas
      // combinations that choke on some CSS in the live page.
      const holder=document.createElement("div");
      const clone=box.cloneNode(true);
      holder.style.cssText="position:fixed;left:-10000px;top:0;width:"+Math.ceil(box.getBoundingClientRect().width)+"px;background:#fff;";
      clone.style.minHeight="0";
      clone.style.height="auto";
      holder.appendChild(clone);
      document.body.appendChild(holder);
      try{
        canvas=await html2canvas(clone,{
          scale:2,backgroundColor:"#fff",useCORS:true,allowTaint:false,
          logging:false,imageTimeout:5000,scrollX:0,scrollY:0
        });
      }finally{holder.remove();}
    }

    const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
    if(!blob) throw new Error("PNG blob failed");
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.download="COUPLE_REPORT.png";
    a.href=url;
    document.body.appendChild(a);
    a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){
    console.error(e);
    alert("PNG 저장에 실패했습니다. 결과페이지를 먼저 열어 표시한 뒤 다시 저장해 주세요.");
  }finally{
    box.classList.remove("export-fit");
  }
}

function saveHTML(){
  // Export the current maker, including all entered couple data, as a
  // self-contained HTML file. Opening it restores the same state.
  const doc=document.documentElement.cloneNode(true);
  const app=[...doc.querySelectorAll("script")].find(s=>s.textContent.includes("let rows=[]"));
  if(app){
    const state=JSON.stringify(rows).replace(/</g,"\\u003c");
    app.textContent=app.textContent.replace(
      /let rows=\[\],n=0;/,
      "let rows="+state+",n="+rows.length+";"
    );
  }
  const preview=doc.querySelector("#previewBox");
  if(preview) preview.style.display="none";

  const blob=new Blob(["<!doctype html>\n"+doc.outerHTML],{
    type:"text/html;charset=utf-8"
  });
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.download="COUPLE_REPORT.html";
  a.href=url;
  document.body.appendChild(a);
  a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
add();
</script>
